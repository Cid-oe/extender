[workspace]
resolver = "2"
members = [
    "crates/extender-common",
    "crates/extender-server",
    "crates/extender-client",
    "crates/extender-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Extender Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
zbus = { version = "4.4", features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
byteorder = "1.5"
crc32fast = "1.4"
socket2 = "0.5"
futures-util = "0.3"
